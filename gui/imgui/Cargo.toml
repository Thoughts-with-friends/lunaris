# forked: https://github.com/Ace314159/NDS-Emulator/tree/e7c8a317db7e1d370f90a17637b338782737b528
[package]
name = "lunaris_imgui"
version = "2.0.0"
authors = ["Akash Munagala <akash.munagala@gmail.com>"]
categories.workspace = true
description.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[build-dependencies]
winres = "0.1.12" # Meta information can be added to the exe.

[dependencies]
gl = "0.14.0"
glfw = { version = "0.62.0", features = ["serde"] }
imgui = "0.7.0"
imgui-opengl-renderer = "0.11.0"
nds-core = { path = "../../core" }
rfd = "0.14"
serde = { workspace = true }
serde_json = "1.0.149"
zstd = "0.13"

[features]
release = []
