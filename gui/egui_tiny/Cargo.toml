# Minimal egui front end for `core-base`.
[package]
name = "egui_tiny"
version.workspace = true
authors.workspace = true
categories.workspace = true
description = "A minimal egui front end for the core-base Nintendo DS core"
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
core-base = { workspace = true }
eframe = { version = "0.33", default-features = false, features = [
  "default_fonts",
  "glow",
  "x11",
  "wayland",
] }
egui = "0.33"
gilrs = "0.11"
rfd = "0.14"

[features]
# Matches the other front ends, which use this flag to select release-only
# behaviour; nothing in this crate is gated on it yet.
release = []
