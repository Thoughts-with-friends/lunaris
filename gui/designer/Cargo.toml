# Block-design debugger: emulate, open the DS, inspect every block live and
# drop FPGA blocks onto the Slot-2 bus. See gui/designer/README.md.
[package]
name = "designer"
version.workspace = true
authors.workspace = true
categories.workspace = true
description = "Lunaris Designer: a Vivado-style block design view and live hardware debugger for the DS"
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

[build-dependencies]
winres = "0.1.12"

[dependencies]
eframe = { version = "0.33", default-features = false, features = [
  "default_fonts",
  "glow",
  "x11",
  "wayland",
] }
egui = "0.33"
ico = "0.5.0"
pollster = "0.4"
rfd = "0.14"
serde.workspace = true
serde_json = "1.0.149"
log = { workspace = true }

ds_emu = { workspace = true }
ds_fpga = { workspace = true }
ds_peripherals = { workspace = true }
ds_spu = { workspace = true }
lunaris_gui_common.workspace = true

[features]
release = []
