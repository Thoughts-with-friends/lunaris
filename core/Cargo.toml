[package]
authors = ["Akash Munagala <akash.munagala@gmail.com>"]
name = "nds-core"
version = "0.1.0"
categories.workspace = true
description.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
bitfield = { path = "../bitfield" }
bitflags = "1.2.1"
bytemuck = "1.5.1"
chrono = "0.4.19"
cpal = "0.13.1"
likely_stable = "0.1.3"
log = { version = "0.4.11", features = ["std"] }
memmap = "0.7.0"
num-integer = "0.1.43"
num-traits = "0.2.12"
priority-queue = "1.0.5"
ringbuf = "0.2.2"
indexmap = "2.14.0"
emu-utils = { git = "https://github.com/Thoughts-with-friends/emu-utils", rev = "10bb6de" }

[dev-dependencies]
free_bios = { workspace = true }
# Only used by the `dump_frame` diagnostic example to write PNGs for visual
# inspection of headless frames; not a production dependency.
image = { version = "0.25", default-features = false, features = ["png"] }
# Also diagnostic-only: lets `dump_frame` restore GUI-written (zstd-compressed)
# savestates so headless runs can start from an in-game scene.
zstd = "0.13"

[features]
nightly = []
