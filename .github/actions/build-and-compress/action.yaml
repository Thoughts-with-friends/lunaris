name: Build and Compress
description: Build a Rust package for a target and compress the resulting binary

inputs:
  target:
    description: Rust target triple
    required: true

  package:
    description: Cargo package name
    required: true

  app_name:
    description: Cargo binary name (the file cargo builds)
    required: true

  bin_name:
    description: Binary name inside the archive (default app_name), e.g. melon_freya for the melonDS build of lunaris_freya
    required: false
    default: ""

  profile:
    description: Cargo build profile
    required: false
    default: release

  features:
    description: Cargo features
    required: false
    default: ""

  no_default_features:
    description: Pass --no-default-features (e.g. freya, whose backend is a feature)
    required: false
    default: "false"

  asset_name:
    description: Output archive name without extension
    required: true

runs:
  using: composite
  steps:
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.target }}

    - name: Build
      shell: bash
      run: |
        args=(--${{ inputs.profile }} --package "${{ inputs.package }}" --target "${{ inputs.target }}")
        if [ "${{ inputs.no_default_features }}" = "true" ]; then
          args+=(--no-default-features)
        fi
        if [ -n "${{ inputs.features }}" ]; then
          args+=(--features "${{ inputs.features }}")
        fi
        cargo build "${args[@]}"

    - name: Prepare output
      shell: bash
      run: |
        rm -rf build
        mkdir -p build

    - name: Copy binary
      if: runner.os != 'Windows'
      shell: bash
      run: |
        cp \
          "target/${{ inputs.target }}/${{ inputs.profile }}/${{ inputs.app_name }}" \
          "build/${{ inputs.bin_name || inputs.app_name }}"

    - name: Copy binary
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Copy-Item `
          "target/${{ inputs.target }}/${{ inputs.profile }}/${{ inputs.app_name }}.exe" `
          "build/${{ inputs.bin_name || inputs.app_name }}.exe"

    - name: Compress Unix
      if: runner.os != 'Windows'
      shell: bash
      run: |
        tar \
          -C build \
          -czf "${{ inputs.asset_name }}.tar.gz" \
          "${{ inputs.bin_name || inputs.app_name }}"

    - name: Compress Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $assetName = "${{ inputs.asset_name }}.zip"

        if ([string]::IsNullOrWhiteSpace($assetName)) {
          throw "asset_name is empty"
        }

        Compress-Archive `
          -Path "build/${{ inputs.bin_name || inputs.app_name }}.exe" `
          -DestinationPath $assetName
