name: Release

on:
  push:
    tags:
      - "*"

env:
  CARGO_TERM_COLOR: always
  PROFILE: release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        app:
          - package: lunaris
            app_name: lunaris
            features: release

          - package: melon_egui
            app_name: melon_egui
            features: release

          # The block-design debugger (gui/designer).
          - package: designer
            app_name: designer
            features: release

          # freya: the core is chosen at build time, one archive per core.
          # Cargo builds `lunaris_freya[.exe]` either way; the melonDS one is
          # renamed `melon_freya[.exe]` so the two never share a name.
          - package: lunaris_freya
            app_name: lunaris_freya
            asset: lunaris_freya
            features: lunaris,release
            no_default_features: true

          - package: lunaris_freya
            app_name: lunaris_freya
            bin_name: melon_freya
            asset: melon_freya
            features: melon,release
            no_default_features: true

        target:
          - target: aarch64-apple-darwin
            os: macos-latest

          - target: x86_64-pc-windows-msvc
            os: windows-latest

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.target.os }}

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup environment
        uses: ./.github/actions/setup-deps
        with:
          platform: ${{ matrix.target.os }}
          build_profile: ${{ env.PROFILE }}

      - name: Build and Compress
        uses: ./.github/actions/build-and-compress
        with:
          target: ${{ matrix.target.target }}
          package: ${{ matrix.app.package }}
          app_name: ${{ matrix.app.app_name }}
          bin_name: ${{ matrix.app.bin_name || matrix.app.app_name }}
          profile: ${{ env.PROFILE }}
          features: ${{ matrix.app.features }}
          no_default_features: ${{ matrix.app.no_default_features || false }}
          asset_name: ${{ matrix.app.asset || matrix.app.app_name }}-${{ matrix.target.target }}

      - name: Release
        uses: ncipollo/release-action@v1.21.0
        with:
          allowUpdates: true
          artifacts: ${{ matrix.app.asset || matrix.app.app_name }}-${{ matrix.target.target }}${{ runner.os == 'Windows' && '.zip' || '.tar.gz' }}
          generateReleaseNotes: true
